apiVersion: apps/v1
kind: Deployment

metadata:
  name: green-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: blue-green-app
      version: green

  template:
    metadata:
      labels:
        app: blue-green-app
        version: green

    spec:
      containers:
        - name: green-app
          image: dineshdevops33/blue-green-app:v2

          ports:
            - containerPort: 5000

          env:
            - name: APP_VERSION
              value: "Green Version 2"
